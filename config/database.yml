# PostgreSQL. Versions 9.3 and up are supported.
#
#   gem install pg
#
#   Ensure the PostgreSQL gem is defined in your Gemfile
#   gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  user: <%= ENV.fetch("DB_USER") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "" } %>

development:
  <<: *default
  database: red_tape_reporter_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: red_tape_reporter_test

# Production configuration. Prefer a single `DATABASE_URL` when available
# (e.g. when using a managed DB or Docker accessory). When `DATABASE_URL`
# is not present we fall back to individual typed databases below.
<% if ENV['DATABASE_URL'] && !ENV['DATABASE_URL'].empty? %>
production:
  url: <%= ENV['DATABASE_URL'] %>
<% else %>
production:
  primary:
    <<: *default
    database: red_tape_reporter_production
  cache:
    <<: *default
    database: red_tape_reporter_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: red_tape_reporter_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: red_tape_reporter_cable
    migrations_paths: db/cable_migrate
<% end %>
